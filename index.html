<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/icons/Pokodex_logo.png">
    <title>Pokedex</title>

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
</head>

<body onload="init()">

    <header class="flex-between-center">
        <div class="logo-container flex-center">
            <img src="./assets/icons/Pokodex_logo.png" alt="Pokedex Logo" class="logo-icon">
            <h2>Neelima's Pokedex</h2>
        </div>

        <div class="search-container flex-center">
            <input type="text" id="searchInput" data-id="search-input" placeholder="Search Pokemon...">
        </div>
    </header>

    <main data-id="content">
        <div id="character-container"></div>

        <dialog data-id="dialog">
            <div data-id="overlay-pokemon-name">
                <button data-id="close-dialog-button" aria-label="Close details">
                    Close
                </button>

                <h2 data-id="dialog-name"></h2>
                <img data-id="dialog-image" alt="">

                <p data-id="dialog-types"></p>
                <p data-id="dialog-hp"></p>
                <p data-id="dialog-attack"></p>
                <p data-id="dialog-defense"></p>

                <button data-id="prev-button" aria-label="Previous Pokémon">
                    Previous
                </button>
                <button data-id="next-button" aria-label="Next Pokémon">
                    Next
                </button>
            </div>
        </dialog>
        
    </main>

    <footer class="flex-center">
        <div class="footer-content flex-column-center">
            <img src="assets/icons/footer_left.png" alt="Footer logo" class="footer-leftlogo">
            <p>&copy; 2026 Neelima's Pokodex</p>
            <img src="./assets/icons/footer_right.png" alt="Footer logo" class="footer-leftlogo">

        </div>
    </footer>

</body>

</html>
