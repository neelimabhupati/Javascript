<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/icons/namaste.png">
    <title>Neelima's Bestellen App</title>
    <link rel="stylesheet" href="style.css">
    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <link rel="stylesheet" href="./styles/standard.css">

</head>

<body onload="renderFoodlist()">
    <header class="header-desktop wrapper">
        <div class="header_content">
            <div class="header_left">
                <img src="./assets/icons/namaste.png" alt="Bestellen logo icon">
                <p> Neelima's Cloud Kitchen</p>
            </div>
            <div class="header_right">
                <img src="./assets/icons/menu.png" alt="menu icon">
            </div>
        </div>
    </header>



    <main>
        <section class="wrapper">
            <div class="hero_section">
                <div class="hero_background"></div>
                <div class="profile_logo">
                    <img src="./assets/images/Biryani logo.jpg" alt="Biryani logo">
                </div>
            </div>
            <div class="restaurant_info">
                <h1>Neelima's Cloud Kitchen</h1>
                <h2>The true homestyle Southern flavor</h2>
            </div>
        </section>
        <div class="main-flex-wrapper wrapper">

            <section class="main_left_content ">
                <div id="food_container_id" class="food-container-id-class "></div>
            </section>

            <div id="stricky-container-id" class="stricky-container-id-class d-none">
                <h3> Your Cart</h3>
                <button class="close-cart-btn" onclick="closeCart()">X</button>
                <!-- <button class="close-btn-last" onclick="closeOrderDialog()"> X </button> -->
                <div id="cart-items"></div>
                <div id="cart-total"></div>

                <button id="buy-now-btn" class="buy-now-btn" onclick="placeOrder()"> Buy Now</button>
                <!-- <div id="oder-message" class="oder-message d-none">Oder Confirmed!</div>
                <h4>Your food is on the way!</h4> -->

                <dialog id="order-confirmed-dialog" class="order-dialog">
                    <img src="./assets/images/Oderconfirmed.jpg" alt="Order Confirmed">
                    <h2>Order Confirmed!</h2>
                    <p>Your food is on the way!</p>
                    <button class="close-btn-last" onclick="closeOrderDialog()"> X </button>
                </dialog>
            </div>
        </div>

    </main>

    <footer class="footer-desktop wrapper">
        <p> 2026 &copy; The Neelima's cloud kitchen All Rights Reserved. Designed by Neelima Bhupati</p>
    </footer>


    <footer id="footer-mobile" class="footer-mobile">
        <button class="footer-btn" onclick="">
            <img src="./assets/icons/home.png" alt="home icon">
        </button>
        <button class="footer-btn" onclick="">
            <img src="./assets/icons/person.png" alt="person icon">
        </button>
        <button class="footer-btn" onclick="">
            <img src="./assets/icons/takeout_dining_2.png" alt="takeout icon">
        </button>
        <button id= "footer-btn" class="footer-btn" onclick="renderCart()">
            <img src="./assets/icons/shopping_cart.png" alt="cart icon">

            <span id="mobile-cart-badge" class="cart-badge d-none">0</span>
        </button>
    </footer>

    <script src="script.js"></script>
</body>

</html>
